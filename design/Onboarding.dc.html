<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#56C3C7; --teal-dark:#2E9BA0; --teal-tint:#E9F9FA; --teal-tint2:#D7F2F3;
  --magenta:#D11972; --magenta-dark:#A81260; --magenta-tint:#FDECF3; --magenta-tint2:#FBD9E7;
  --ink:#262626; --ink-2:#4B4B4B; --ink-3:#606060; --ink-4:#9AA0A6;
  --line:#ECECEC; --bg:#FAFAF9; --card:#FFFFFF;
  --amber:#E8A23A; --amber-tint:#FFF3DF;
  --green:#2E9E5B; --green-tint:#E8F7EE;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#EDEDEC;}
a{color:var(--magenta-dark);text-decoration:none;}
a:hover{color:var(--magenta);}
.frame{
  width:390px;background:var(--bg);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ink);display:flex;flex-direction:column;position:relative;
  min-height:844px;
}
.disp{font-family:'Baloo 2',ui-rounded,sans-serif;}
img{display:block;max-width:100%;}
.row{display:flex;flex-direction:row;}
.col{display:flex;flex-direction:column;}
.grow{flex-grow:1;}
.pill{border-radius:999px;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;
  box-shadow:0 1px 2px rgba(38,38,38,0.03),0 10px 24px -16px rgba(38,38,38,0.18);
}
.btn{
  font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:700;font-size:15px;
  border-radius:999px;padding:15px 20px;display:flex;align-items:center;justify-content:center;gap:8px;
  border:none;cursor:pointer;
}
.btn-primary{background:var(--magenta);color:#fff;}
.btn-outline{background:#fff;border:1.6px solid var(--teal);color:var(--teal-dark);}
.btn-outline-mag{background:#fff;border:1.6px solid var(--magenta);color:var(--magenta-dark);}
.chip{
  border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.chip-teal{background:var(--teal-tint);color:var(--teal-dark);}
.chip-mag{background:var(--magenta-tint);color:var(--magenta-dark);}
.chip-amber{background:var(--amber-tint);color:#9C6B0E;}
.chip-green{background:var(--green-tint);color:var(--green);}
.chip-gray{background:#F1F1F0;color:var(--ink-3);}
.input{
  width:100%;border:1.4px solid var(--line);border-radius:14px;padding:14px 14px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;color:var(--ink);background:#fff;
}
.label{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:8px;display:block;}
.req{color:var(--magenta);}
.hint{font-size:12px;color:var(--ink-4);margin:2px 0 10px;line-height:1.5;}
.section{padding:20px;}
.hdr-bar{
  background:var(--teal-dark);color:#fff;padding:18px 20px 20px;display:flex;align-items:center;gap:14px;
}
.hdr-bar .disp{font-size:19px;font-weight:700;}
.iconbtn{
  width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.divider{height:1px;background:var(--line);width:100%;}
.navbar{
  margin-top:auto;background:#fff;border-top:1px solid var(--line);
  height:78px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;
  position:sticky;bottom:0;
}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-4);font-size:10.5px;font-weight:600;width:58px;}
.navitem.active{color:var(--magenta-dark);}
.navfab{
  width:56px;height:56px;border-radius:50%;background:var(--magenta);display:flex;align-items:center;
  justify-content:center;margin-top:-30px;box-shadow:0 8px 18px -6px rgba(209,25,114,0.55);border:5px solid #fff;
}
</style>
</helmet>
<div class="frame">
<div class="col" style="padding:22px 20px 0;">
  <div class="row" style="justify-content:flex-end;">
    <span style="font-size:13px;font-weight:700;color:var(--ink-3);">Lewati</span>
  </div>
  <div style="height:14px;"></div>
  
<div style="height:230px;border-radius:24px;background:linear-gradient(160deg,var(--teal-tint) 0%,var(--magenta-tint) 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">
  <div style="position:absolute;top:18px;left:18px;width:34px;height:34px;border-radius:50%;background:#fff;opacity:.6;"></div>
  <div style="position:absolute;bottom:22px;right:26px;width:20px;height:20px;border-radius:50%;background:#fff;opacity:.5;"></div>
  <svg width="180" height="150" viewBox="0 0 180 150" fill="none">
    <circle cx="60" cy="46" r="22" fill="#56C3C7"/>
    <circle cx="120" cy="46" r="22" fill="#D11972" opacity="0.85"/>
    <circle cx="90" cy="60" r="17" fill="#2E9BA0"/>
    <path d="M20 140c8-34 30-52 55-52s45 16 52 52" stroke="#56C3C7" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M95 140c6-24 20-36 40-36s32 12 38 36" stroke="#D11972" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
  </svg>
</div>

  <div style="height:22px;"></div>
  <div class="disp" style="font-size:21px;font-weight:800;color:var(--ink);">Pilih kebutuhan vaksinasi Anda</div>
  <div style="font-size:13px;color:var(--ink-3);margin-top:6px;line-height:1.55;">
    VaksinKu menyesuaikan rekomendasi &amp; paket berdasarkan kebutuhan keluarga Anda.
  </div>
  <div style="height:18px;"></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;">
    
    <div style="position:relative;border:1.6px solid var(--magenta);background:var(--magenta-tint);border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;">
      <div style="position:absolute;top:10px;right:10px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--magenta)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.6 2.6L16.2 9"/></svg></div>
      <div style="width:42px;height:42px;border-radius:50%;background:var(--magenta);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="2.6"/><circle cx="16" cy="7.5" r="2.6"/><circle cx="12" cy="9.5" r="2"/><path d="M3.5 20c.6-2.7 2.2-4.3 4.5-4.3s3.6 1.3 4 3M12 20c.4-1.7 1.5-3 3-3.4M15.5 15.7c2.3 0 3.9 1.6 4.5 4.3"/></svg>
      </div>
      <div>
        <div style="font-weight:700;font-size:14px;">Vaksin Anak</div>
        <div style="font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4;">Imunisasi dasar &amp; lanjutan</div>
      </div>
    </div>
    
    <div style="position:relative;border:1.4px solid var(--line);background:#fff;border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;">
      
      <div style="width:42px;height:42px;border-radius:50%;background:var(--teal-tint);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--teal-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>
      </div>
      <div>
        <div style="font-weight:700;font-size:14px;">Vaksin Dewasa</div>
        <div style="font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4;">HPV, flu, tifoid, dll</div>
      </div>
    </div>
    
    <div style="position:relative;border:1.4px solid var(--line);background:#fff;border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;">
      
      <div style="width:42px;height:42px;border-radius:50%;background:var(--teal-tint);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--teal-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13.5 21 6l-7.5 18-2.5-7L3 13.5Z"/></svg>
      </div>
      <div>
        <div style="font-weight:700;font-size:14px;">Umroh &amp; Haji</div>
        <div style="font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4;">Meningitis wajib jamaah</div>
      </div>
    </div>
    
    <div style="position:relative;border:1.4px solid var(--line);background:#fff;border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;">
      
      <div style="width:42px;height:42px;border-radius:50%;background:var(--teal-tint);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--teal-dark)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.3-8.9A5 5 0 0 1 12 6.2a5 5 0 0 1 9.3 4.9C19 15.6 12 20 12 20Z"/></svg>
      </div>
      <div>
        <div style="font-weight:700;font-size:14px;">Lansia</div>
        <div style="font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4;">Influenza, pneumonia</div>
      </div>
    </div>
  </div>
</div>
<div class="grow"></div>
<div style="padding:18px 20px 26px;display:flex;flex-direction:column;gap:12px;">
  <div class="row" style="justify-content:center;gap:7px;">
    <div style="width:7px;height:7px;border-radius:50%;background:var(--line);"></div>
    <div style="width:18px;height:7px;border-radius:4px;background:var(--magenta);"></div>
    <div style="width:7px;height:7px;border-radius:50%;background:var(--line);"></div>
  </div>
  <button class="btn btn-primary">Lanjutkan <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
</div>
</x-dc>
</body>
</html>
