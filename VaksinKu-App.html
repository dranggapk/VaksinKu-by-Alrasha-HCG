  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.id === 'cari-vaksin') { cariVaksin = el.value; sheetHTML = sheetVaksin(); render(); return; }
    if (el.id === 'cari-harga') {
      cariHarga = el.value;
      var pos = el.selectionStart; render();
      var n = document.getElementById('cari-harga');
      if (n) { n.focus(); n.setSelectionRange(pos, pos); }
      return;
    }
    var fk = el.getAttribute('data-fieldk');
    if (fk) {
      var dk = draftKonsul();
      dk[fk] = el.value;
      simpan();
      if (fk === 'pertanyaan') {
        // perbarui pratinjau di tempat supaya kursor mengetik tidak hilang
        var pv = document.querySelector('.pratinjau');
        if (pv) {
          pv.textContent = pesanKonsultasi({
            kode: 'KS-XXXXXX', pendaftar: S.profil, pasienId: dk.pasienId,
            dokter: dk.dokterIdx === '' ? '' : (K.dokter[dk.dokterIdx] || [''])[0],
            topik: dk.topik || '(belum dipilih)', pertanyaan: dk.pertanyaan || '(belum diisi)',
            konteks: dk.lampirkan && dk.pasienId ? konteksPasien(dk.pasienId) : []
          });
        }
      } else { render(); }
      return;
    }
    var f = el.getAttribute('data-field');
    if (!f) return;
    if (f.indexOf('profil.') === 0) S.profil[f.split('.')[1]] = el.value;
    else if (f.indexOf('kor.') === 0) {
      S.korporat[f.split('.')[1]] = el.value; simpan();
      // hanya pilihan vaksin yang mengubah estimasi; isian tanggal jangan
      // digambar ulang agar fokus tidak lepas saat tanggal diketik manual
      if (f === 'kor.vaksinId') render();
      return;
    }
    else draft()[f] = el.value;
    simpan();
    if (f === 'tanggal') render();
  });

  document.addEventListener('change', function (ev) {
    if (ev.target.id !== 'file-impor' || !ev.target.files.length) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var data = JSON.parse(fr.result);
        if (!data || typeof data !== 'object' || !('pasien' in data)) throw new Error('bukan cadangan VaksinKu');
        for (var k in kosong) if (!(k in data)) data[k] = JSON.parse(JSON.stringify(kosong[k]));
        S = data; simpan(); render(); toast('Data berhasil dipulihkan.');
      } catch (e) { toast('Berkas tidak dikenali sebagai cadangan VaksinKu.'); }
    };
    fr.readAsText(ev.target.files[0]);
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    // catatan: pakai getAttribute('id') — properti f.id bisa tertutup oleh
    // kontrol form yang bernama sama (named property access pada <form>).
    var f = ev.target, formId = f.getAttribute('id');
    var get = function (n) { return (f.elements[n] ? f.elements[n].value : '').trim(); };
    formErr = {};
    if (formId === 'form-pasien') {
      if (!get('nama')) formErr.nama = 'Nama pasien wajib diisi.';
      if (!get('tglLahir')) formErr.tglLahir = 'Tanggal lahir wajib diisi.';
      else if (get('tglLahir') > hariIni()) formErr.tglLahir = 'Tanggal lahir tidak boleh di masa depan.';
      if (Object.keys(formErr).length) { render(); return; }
      var id = get('pid');
      if (id) {
        S.pasien.forEach(function (p) {
          if (p.id !== id) return;
          p.nama = get('nama'); p.tglLahir = get('tglLahir');
          p.jenisKelamin = get('jenisKelamin'); p.hubungan = get('hubungan');
        });
      } else {
        var baru = { id: uid(), nama: get('nama'), tglLahir: get('tglLahir'), jenisKelamin: get('jenisKelamin'), hubungan: get('hubungan') };
        S.pasien.push(baru);
        if (!S.ui.pasienAktif) S.ui.pasienAktif = baru.id;
      }
      simpan(); location.hash = '#/pasien'; toast(id ? 'Data pasien diperbarui.' : 'Pasien ditambahkan.');
      return;
    }
    if (formId === 'form-masuk') {
      var nm = get('nama'), hp = get('hp'), digit = hp.replace(/\D/g, '');
      if (!nm) formErr.nama = 'Nama wajib diisi.';
      if (!hp) formErr.hp = 'Nomor HP wajib diisi.';
      else if (digit.length < 9 || digit.length > 15) formErr.hp = 'Nomor HP tidak valid — isi 9–15 digit, contoh 081234567890.';
      if (Object.keys(formErr).length) { render(); return; }
      S.profil.nama = nm; S.profil.hp = hp;
      selesaikanOnboarding('hp');
      location.hash = '#/beranda';
      toast('Selamat datang, ' + nm.split(' ')[0] + '.');
      return;
    }
    if (formId === 'form-korporat') {
      if (!S.korporat.jenis) formErr.jenis = 'Pilih sekolah atau perusahaan.';
      if (!get('nama')) formErr.nama = 'Nama institusi wajib diisi.';
      if (Object.keys(formErr).length) { render(); return; }
      var baruKor = !S.korporat.nama;
      S.korporat.nama = get('nama');
      S.korporat.periode = get('periode');
      S.korporat.aktif = true;
      simpan(); location.hash = '#/korporat';
      toast(baruKor ? 'Dashboard dibuat.' : 'Data institusi diperbarui.');
      return;
    }
    if (formId === 'form-peserta-kor') {
      if (!get('nama')) { formErr.knama = 'Nama peserta wajib diisi.'; render(); return; }
      S.korporat.unitTerakhir = get('unit');
      S.korporat.peserta.push({ id: uid(), nama: get('nama'), unit: get('unit'), status: 'belum', tanggal: '', vaksin: '' });
      simpan(); render(); toast(get('nama') + ' ditambahkan.');
      return;
    }
    if (formId === 'form-massal-kor') {
      var unitM = get('unit');
      if (!unitM) formErr.unit = korUnitLabel() + ' wajib diisi.';
      var namaM = (f.elements.nama ? f.elements.nama.value : '').split('\n')
        .map(function (x) { return x.replace(/^\s*[\d.)-]+\s*/, '').trim(); })
        .filter(function (x) { return x.length > 1; });
      if (!namaM.length) formErr.nama = 'Tempelkan minimal satu nama.';
      if (Object.keys(formErr).length) { render(); return; }
      var adaM = 0, tambahM = 0;
      namaM.forEach(function (n) {
        var kembar = S.korporat.peserta.some(function (x) {
          return x.unit === unitM && x.nama.toLowerCase() === n.toLowerCase();
        });
        if (kembar) { adaM++; return; }
        S.korporat.peserta.push({ id: uid(), nama: n, unit: unitM, status: 'belum', tanggal: '', vaksin: '' });
        tambahM++;
      });
      S.korporat.unitTerakhir = unitM;
      S.korporat.tab = 'peserta';
      simpan(); location.hash = '#/korporat';
      toast(tambahM + ' peserta ditambahkan' + (adaM ? ', ' + adaM + ' nama sudah ada' : '') + '.');
      return;
    }
    if (formId === 'form-alamat') {
      if (!get('label')) formErr.label = 'Label wajib diisi.';
      if (!get('kecamatan')) formErr.kecamatan = 'Kecamatan/kota wajib diisi.';
      if (!get('alamat')) formErr.alamat = 'Alamat lengkap wajib diisi.';
      if (Object.keys(formErr).length) { render(); return; }
      var a = { id: uid(), label: get('label'), kecamatan: get('kecamatan'), alamat: get('alamat'), patokan: get('patokan') };
      S.alamat.push(a);
      draft().alamatId = a.id;
      simpan(); location.hash = '#/alamat'; toast('Alamat ditambahkan.');
      return;
    }
    if (formId === 'form-jawaban') {
      var jwb = get('jawaban');
      if (jwb.length < 2) { formErr.jawaban = 'Tulis jawaban dokter terlebih dahulu.'; render(); return; }
      var kid = route.param;
      S.konsultasi.forEach(function (k) {
        if (k.id !== kid) return;
        k.pesan.push({ id: uid(), dari: 'dokter', teks: jwb, waktu: new Date().toISOString() });
        if (k.status === 'terkirim') k.status = 'dijawab';
      });
      simpan(); render(); toast('Jawaban dokter tercatat.');
      return;
    }
    if (formId === 'form-tumbuh') {
      if (!get('berat') && !get('tinggi') && !get('kepala')) {
        formErr.tumbuh = 'Isi minimal salah satu: berat, tinggi, atau lingkar kepala.';
        render(); return;
      }
      S.pertumbuhan.push({
        id: uid(), pasienId: get('pasienId'), tanggal: get('tanggal') || hariIni(),
        berat: get('berat'), tinggi: get('tinggi'), kepala: get('kepala')
      });
      simpan(); location.hash = '#/rekam'; toast('Pengukuran tersimpan.');
      return;
    }
  });

  /* ============================ data contoh ============================ */
  function muatContoh() {
    if (!konfirmasi('Muat data contoh untuk mencoba aplikasi? Data yang ada sekarang akan diganti.')) return;
    var thn = new Date().getFullYear();
    S = JSON.parse(JSON.stringify(kosong));
    S.profil = { nama: 'Contoh Pengguna', hp: '0812xxxxxxx', jenisKelamin: 'Perempuan' };
    S.onboarding = { selesai: true, langkah: 2, fokus: ['anak'], layanan: 'homecare' };
    S.akun = { masuk: true, metode: 'hp' };
    var anak = { id: uid(), nama: 'Nadia Contoh', tglLahir: (thn - 5) + '-05-12', jenisKelamin: 'Perempuan', hubungan: 'Anak' };
    var ayah = { id: uid(), nama: 'Bayu Contoh', tglLahir: (thn - 34) + '-02-08', jenisKelamin: 'Laki-laki', hubungan: 'Ayah' };
    S.pasien = [anak, ayah];
    S.ui.pasienAktif = anak.id;
    S.alamat = [{ id: uid(), label: 'Rumah', kecamatan: 'Tanjungpinang Kota, Kepulauan Riau', alamat: 'Jl. Contoh No. 10', patokan: '' }];
    ['Hep B 0', 'Polio 0', 'BCG', 'Combo DPT 1', 'PCV 1', 'Rotavirus 1', 'Combo DPT 2'].forEach(function (lb, i) {
      S.riwayat.push({ id: uid(), pasienId: anak.id, label: lb, tanggal: (thn - 5) + '-0' + Math.min(9, 5 + i) + '-20', sumber: 'jadwal' });
    });
    S.pertumbuhan = [
      { id: uid(), pasienId: anak.id, tanggal: (thn - 1) + '-06-10', berat: '15.2', tinggi: '102', kepala: '49' },
      { id: uid(), pasienId: anak.id, tanggal: thn + '-01-15', berat: '16.8', tinggi: '106', kepala: '49.5' },
      { id: uid(), pasienId: anak.id, tanggal: hariIni(), berat: '17.9', tinggi: '109', kepala: '50' }
    ];
    simpan(); location.hash = '#/beranda'; render();
    toast('Data contoh dimuat. Hapus kapan saja lewat Profil.');
  }

  /* ============================ init ============================ */
  window.addEventListener('hashchange', function () {
    bacaRoute(); sheetHTML = ''; formErr = {};
    if (route.name !== 'booking') errB = {};
    if (route.name !== 'chat-baru') errK = {};
    render();
    var sc = document.getElementById('scroll');
    if (sc) sc.scrollTop = 0;
  });
  bacaRoute();
  render();
  // pengingat penting ditampilkan sebagai notifikasi browser saat aplikasi dibuka,
  // lalu diperiksa ulang tiap 30 menit selama aplikasi tetap terbuka
  setTimeout(tampilkanNotifBrowser, 1200);
  setInterval(tampilkanNotifBrowser, 18e5);
})();
