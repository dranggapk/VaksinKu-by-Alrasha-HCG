/* ---------- captions ---------- */
const CAPS=[[0.3,4.0,"Positif! Terus… <b>apa yang harus disiapkan?</b>"],[4.2,9.0,"Yuk, isi bekal perjalanan Bunda."],
[9.2,15.0,"<b>Sekolah Ibu Hamil Batch 6</b> · kelas online bersama dokter Sp.OG"],

[52.1,57.0,"<b>199K</b> satu batch, termasuk Akses Premium"],[57.1,60.0,"Hamil bukan perjalanan sendirian. <b>Daftar sekarang!</b>"]];

/* ---------- engine ---------- */
function rnd(a,b){const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x);}
const capEl=document.getElementById('cap');let lastCap=null;
let measured=false;
function measure(){for(const o of objs){o.el.style.transform='none';o.w=o.el.offsetWidth;o.h=o.el.offsetHeight;}}
window.seek=function(t){
 if(!measured&&document.fonts.status==='loaded'&&[...document.images].every(i=>i.complete)){measure();measured=true;}
 const f=Math.floor(t*FPS+1e-6),tq=f/FPS;
 for(const o of objs){const v=at(o.kf,tq);if(!v||v[4]<=0.01){o.el.style.opacity=0;continue;}
  const jx=(rnd(f,o.i)-.5)*4,jy=(rnd(o.i,f)-.5)*4,jr=(rnd(f+7,o.i)-.5)*1.2;
  o.el.style.opacity=v[4];o.el.style.transform=`translate(${v[0]-o.w/2+jx}px,${v[1]-o.h/2+jy}px) rotate(${v[2]+jr}deg) scale(${v[3]})`;}
 // testpack lines
 document.getElementById('l1').style.opacity=tq>=1.0?1:0;document.getElementById('l2').style.opacity=tq>=1.7?1:0;
 const n=Math.max(22,Math.min(29,22+Math.floor((tq-18.0)*FPS)));document.getElementById('calnum').textContent=n;
 const c=CAPS.find(c=>tq>=c[0]&&tq<c[1]);const html=c?c[2]:'';
 if(html!==lastCap){capEl.innerHTML=html;capEl.style.display=html?'block':'none';lastCap=html;}
 if(c){capEl.style.transform=`rotate(${(rnd(f,99)-.5)*0.8}deg)`;}
 document.body.style.filter=`brightness(${1+(rnd(f,3)-.5)*0.03})`;
};
window.DURATION=60;
seek(0);
